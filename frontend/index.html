<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    </div>
  </nav>

  <div class="container">

    <div id="alert-box"></div>

    <div id="spinner" class="text-center mb-3" style="display: none;">
      <div class="spinner-border"></div>
    </div>

    <div class="summary-grid mb-4">
      <div>
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-title">Total</h6>
            <p class="fs-4" id="summary-total">$0.00</p>
          </div>
        </div>
      </div>
      <div>
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-title">Count</h6>
            <p class="fs-4" id="summary-count">0</p>
          </div>
        </div>
      </div>
      <div>
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-title">Highest</h6>
            <p class="fs-4" id="summary-highest">$0.00</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Add Expense</h5>
        <form id="add-form" class="row g-3" novalidate>
          <div class="col-md-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="input-title">
            <div class="invalid-feedback" id="error-title"></div>
          </div>
          <div class="col-md-2">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="input-amount">
            <div class="invalid-feedback" id="error-amount"></div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="input-category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="input-date">
            <div class="invalid-feedback" id="error-date"></div>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Add</button>
          </div>
        </form>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Expenses</h5>
      <select class="form-select w-auto" id="filter-category">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenses-table-body"></tbody>
      </table>
    </div>

  </div>

  <div class="modal fade" id="edit-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="edit-form" novalidate>
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="edit-title">
            </div>
            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" id="edit-amount">
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" id="edit-category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="edit-date">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-edit-btn">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
